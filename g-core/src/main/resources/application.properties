spring.application.name=g-core
spring.profiles.default=local

server.port=9091

spring.config.import=optional:classpath:private-info.properties
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_EXPIRATION:${JWT_EXPIRATION:900000}}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

core.email-verification=${EMAIL_VERIFICATION_ENABLED:false}
core.email-verification-token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
core.public-url=${PUBLIC_URL:http://localhost:3042}
core.mail-from=${MAIL_FROM:gradinator@localhost}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.provider.yandex.authorization-uri=https://oauth.yandex.ru/authorize
spring.security.oauth2.client.provider.yandex.token-uri=https://oauth.yandex.ru/token
spring.security.oauth2.client.provider.yandex.user-info-uri=https://login.yandex.ru/info?format=json
spring.security.oauth2.client.provider.yandex.user-name-attribute=id

spring.security.oauth2.client.provider.vk.authorization-uri=https://id.vk.com/authorize
spring.security.oauth2.client.provider.vk.token-uri=https://id.vk.com/oauth2/auth
spring.security.oauth2.client.provider.vk.user-info-uri=https://id.vk.com/oauth2/user_info
spring.security.oauth2.client.provider.vk.user-name-attribute=user_id

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.pattern.console=%d{dd.MM HH:mm:ss.SSS} %-5level %logger{36} : %msg%n

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN

core.rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:20}
core.rate-limit.auth.refill-minutes=1
core.rate-limit.email.capacity=${RATE_LIMIT_EMAIL_CAPACITY:5}
core.rate-limit.email.refill-minutes=10
core.rate-limit.general.capacity=${RATE_LIMIT_GENERAL_CAPACITY:300}
core.rate-limit.general.refill-minutes=1
