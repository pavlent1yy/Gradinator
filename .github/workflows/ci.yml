name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Тесты ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [g-api, g-core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp -pl ${{ matrix.module }} -am verify
        env:
          TZ: Europe/Moscow

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports
          retention-days: 7

  web:
    name: g-web lint и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: g-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          G_CORE_URL: http://g-core:9091
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Сборка образов
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    needs: [backend, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: g-api
            dockerfile: Dockerfile
            args: MODULE=g-api
          - image: g-core
            dockerfile: Dockerfile
            args: MODULE=g-core
          - image: g-web
            dockerfile: Dockerfile.web
            args: G_CORE_URL=http://g-core:9091
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          tags: gradinator-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ matrix.image }}.tar
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Compress deployment image
        run: gzip -1 /tmp/${{ matrix.image }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 2
