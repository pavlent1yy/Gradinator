name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: PostgreSQL production schema validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gradinator_core
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d gradinator_core"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -pl g-core -am package -DskipTests
      - name: Boot production profile against migrated PostgreSQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gradinator_core
          DB_USERNAME: ci
          DB_PASSWORD: ci-only
          JWT_SECRET: ci-only-not-a-production-secret-at-least-32-bytes-long
        run: |
          java -jar g-core/target/g-core-*.jar > /tmp/core-schema.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9091/api/core/auth/me || true)
            if [ "$status" = 401 ]; then
              echo 'Production migrations and Hibernate validation passed'
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/core-schema.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/core-schema.log
          exit 1

  deployment:
    name: Deployment safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/test-deploy.sh

  backend:
    name: Тесты ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [g-api, g-core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp -pl ${{ matrix.module }} -am verify
        env:
          TZ: Europe/Moscow

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports
          retention-days: 7

  web:
    name: g-web lint и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: g-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          G_CORE_URL: http://g-core:9091
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Сборка образов
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    needs: [backend, web, deployment, migrations]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: g-api
            dockerfile: Dockerfile
            args: MODULE=g-api
          - image: g-core
            dockerfile: Dockerfile
            args: MODULE=g-core
          - image: g-web
            dockerfile: Dockerfile.web
            args: G_CORE_URL=http://g-core:9091
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          tags: gradinator-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ matrix.image }}.tar
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Compress deployment image
        run: gzip -1 /tmp/${{ matrix.image }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-image-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 2
