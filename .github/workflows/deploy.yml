name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Выкатка на прод
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deploy-image-*
          path: images
          merge-multiple: true
      - name: Загрузка готовых образов и деплой по SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/scanned" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$ssh_dir/scanned"
          while IFS= read -r host_key; do
            fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')
            if [ "$fingerprint" = "$DEPLOY_HOST_FINGERPRINT" ]; then
              printf '%s\n' "$host_key" >> "$ssh_dir/known_hosts"
            fi
          done < "$ssh_dir/scanned"
          test -s "$ssh_dir/known_hosts" || { echo 'Server fingerprint does not match'; exit 1; }
          ssh_options=(-i "$ssh_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=20)
          for service in g-api g-core g-web; do
            echo "Loading $service image for $GITHUB_SHA"
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" load < "images/$service.tar.gz"
          done
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Проверка снаружи
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          test -n "$PROD_URL"
          curl -fsS --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$PROD_URL/"
          curl -fsS --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$PROD_URL/api/core/schedule/groups"
