spring.application.name=g-api

server.port=9090

spring.config.import=optional:classpath:private-info.properties
spring.datasource.url=jdbc:postgresql://localhost:5433/gradin
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

api.start-with-heartbeat=false
api.file-source-url=https://ygk.edu.yar.ru/pages/rasp/26-27/
api.first-shift-url=https://menu.sttec.yar.ru/timetable/rasp_second.html
api.second-shift-url=https://menu.sttec.yar.ru/timetable/rasp_first.html
api.storage-dir-path=./g-api/scheduleFiles
api.groups-config-path=./groups.cfg

gradinator.rate-limit.schedule.capacity=60
gradinator.rate-limit.schedule.refill-minutes=1
gradinator.rate-limit.schedule-all.capacity=10
gradinator.rate-limit.schedule-all.refill-minutes=1
gradinator.rate-limit.user.capacity=30
gradinator.rate-limit.user.refill-minutes=1
gradinator.rate-limit.admin.capacity=5
gradinator.rate-limit.admin.refill-minutes=1


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.tomcat.max-http-form-post-size=1MB
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=50
server.tomcat.max-connections=200
server.tomcat.connection-timeout=5s

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.pattern.console=%d{dd.MM HH:mm:ss.SSS} %-5level %logger{36} : %msg%n
logging.level.root=WARN
logging.level.com.pavlent1yy.gradinator=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.apache.tomcat=WARN